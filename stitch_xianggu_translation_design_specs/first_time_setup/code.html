<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>香菇翻译 - 开始连接</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#a9f2c8",
                        "surface-bright": "#f0fdf1",
                        "on-primary-container": "#9fe7be",
                        "primary-fixed-dim": "#8ed6ad",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#e4f1e6",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#005133",
                        "on-tertiary-container": "#ccdbd0",
                        "surface-container-low": "#eaf7eb",
                        "on-background": "#131e17",
                        "surface-tint": "#226b4a",
                        "outline": "#707972",
                        "secondary": "#566500",
                        "on-error": "#ffffff",
                        "tertiary": "#3c4941",
                        "surface-container-high": "#deece0",
                        "tertiary-fixed-dim": "#bbcabf",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#404c00",
                        "background": "#f0fdf1",
                        "on-tertiary-fixed-variant": "#3c4a42",
                        "surface-container-highest": "#d9e6da",
                        "tertiary-fixed": "#d7e6db",
                        "tertiary-container": "#536158",
                        "on-primary-fixed": "#002112",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "primary-container": "#216a49",
                        "inverse-primary": "#8ed6ad",
                        "inverse-surface": "#28332b",
                        "secondary-container": "#d9ed78",
                        "on-surface-variant": "#404942",
                        "secondary-fixed-dim": "#bdd05f",
                        "surface-dim": "#d0ddd2",
                        "inverse-on-surface": "#e7f4e8",
                        "on-secondary-container": "#5c6b00",
                        "surface": "#f0fdf1",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#d9ed78",
                        "on-secondary-fixed": "#181e00",
                        "on-surface": "#131e17",
                        "on-tertiary-fixed": "#121e17",
                        "surface-variant": "#d9e6da",
                        "on-primary-fixed-variant": "#005234",
                        "outline-variant": "#bfc9c0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "20px",
                        "xs": "4px",
                        "3xl": "32px",
                        "lg": "16px",
                        "sm": "8px",
                        "md": "12px",
                        "2xl": "24px"
                    },
                    "fontFamily": {
                        "label-sm": ["JetBrains Mono"],
                        "display": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "label-xs": ["JetBrains Mono"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-xs": ["10px", { "lineHeight": "12px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar -->
<header class="bg-background border-b border-outline-variant flex justify-between items-center w-full px-lg h-[56px] fixed top-0 left-0 z-50">
<div class="flex items-center gap-sm text-primary">
<span class="material-symbols-outlined text-headline-md font-headline-md">menu</span>
<span class="text-headline-md font-headline-md font-bold">香菇翻译</span>
</div>
<div class="text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full p-xs cursor-pointer">
<span class="material-symbols-outlined text-[24px]">settings</span>
</div>
</header>
<main class="pt-[56px] pb-[80px] px-lg max-w-[420px] mx-auto w-full flex flex-col gap-xl">
<!-- Header -->
<div class="mt-lg">
<h1 class="text-display font-display text-primary">开始连接</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-xs">连接你自己的模型服务，不创建新账号。</p>
</div>
<!-- Section 1: Connect Service -->
<section class="bg-surface border border-outline-variant rounded-xl p-md flex flex-col gap-md">
<h2 class="text-headline-md font-headline-md text-on-surface border-b border-outline-variant pb-xs">连接服务</h2>
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase">Service Provider</label>
<select class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-md py-sm text-body-md font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors">
<option value="deepseek">DeepSeek</option>
<option value="openai">OpenAI</option>
<option value="anthropic">Anthropic</option>
</select>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase">Base URL</label>
<input class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-md py-sm text-body-md font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors placeholder:text-outline" placeholder="https://api.deepseek.com/v1" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase flex justify-between">
                    API Key
                    <div class="flex gap-sm">
<button class="text-primary hover:text-primary-container transition-colors">Show</button>
<button class="text-error hover:text-error-container transition-colors">Clear</button>
</div>
</label>
<input class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-md py-sm text-body-md font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors placeholder:text-outline font-label-sm" placeholder="sk-..." type="password"/>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase">Model Name</label>
<div class="flex gap-sm">
<select class="flex-1 bg-surface border border-outline-variant rounded-DEFAULT px-md py-sm text-body-md font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors">
<option value="deepseek-chat">deepseek-chat</option>
<option value="deepseek-coder">deepseek-coder</option>
</select>
<button class="bg-surface-container border border-outline-variant rounded-DEFAULT px-sm py-sm text-label-sm font-label-sm text-on-surface hover:bg-surface-container-high transition-colors whitespace-nowrap">获取模型</button>
</div>
</div>
<button class="bg-surface border border-primary text-primary rounded-DEFAULT py-sm text-body-md font-body-md font-bold hover:bg-surface-container-low transition-colors w-full mt-xs">测试翻译</button>
</section>
<!-- Section 2: Preferences -->
<section class="bg-surface border border-outline-variant rounded-xl p-md flex flex-col gap-md">
<h2 class="text-headline-md font-headline-md text-on-surface border-b border-outline-variant pb-xs">翻译偏好</h2>
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase">Target Language</label>
<select class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-md py-sm text-body-md font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors">
<option value="en">English (Default)</option>
<option value="zh">Chinese</option>
<option value="ja">Japanese</option>
</select>
</div>
<div class="flex flex-col gap-xs opacity-50 cursor-not-allowed">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase">Custom Target Language</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-DEFAULT px-md py-sm text-body-md font-body-md cursor-not-allowed" disabled="" placeholder="e.g. Classical Latin" type="text"/>
</div>
<div class="flex items-center justify-between mt-xs">
<span class="text-body-md font-body-md text-on-surface">Auto Translate</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<div class="flex flex-col gap-xs mt-sm">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase">Theme</label>
<div class="flex bg-surface-container-low border border-outline-variant rounded-DEFAULT overflow-hidden">
<button class="flex-1 py-xs text-body-md font-body-md bg-surface border-r border-outline-variant font-semibold text-primary">跟随系统</button>
<button class="flex-1 py-xs text-body-md font-body-md hover:bg-surface-container text-on-surface-variant border-r border-outline-variant transition-colors">浅色</button>
<button class="flex-1 py-xs text-body-md font-body-md hover:bg-surface-container text-on-surface-variant transition-colors">深色</button>
</div>
</div>
</section>
<!-- Section 3: Privacy Note -->
<section class="bg-[#f7faf8] border-l-4 border-secondary-container p-md rounded-r-xl">
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-tertiary text-[20px] mt-[2px]">privacy_tip</span>
<p class="text-body-md font-body-md text-tertiary leading-relaxed">
                    API Key 与待翻译文本只会发送到你配置的服务商地址。扩展不保存持久翻译历史；当前草稿和最近结果只保留在浏览器会话中。
                </p>
</div>
</section>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 left-0 w-full bg-background border-t border-outline-variant p-md z-40 max-w-[420px] left-1/2 -translate-x-1/2">
<button class="w-full bg-primary text-on-primary rounded-lg py-[12px] text-headline-md font-headline-md font-bold hover:bg-primary-container transition-colors shadow-sm">
            保存并开始翻译
        </button>
</footer>
</body></html>
